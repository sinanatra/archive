<!DOCTYPE html>
<html>

<head>
    <script src="vendor/jquery-3.3.1.min.js"></script>
</head>

<body>
    <div class="background"></div>

    <div class="images"></div>

    <script>
        $(document).ready(function() {
            var parseElement = 2;

            function parseData() {
                // $(".images").append("");
                if (parseElement == 396){
                    parseElement = 2;
                }
                $(".images").append('<img src="images/loading_' + parseElement + '.gif" />');
                parseElement++;
            }

            setInterval(function() {
                parseData();
            }, 500);


        });
    </script>
    <style>
        .background{
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: gainsboro;
            mix-blend-mode: multiply;
            z-index: 100;
        }
        .images img {
            /* display: block;
            width: auto; */
            height:  40px;
            max-width: 100%;
            margin: auto;
            /* padding-top: 20vw; */
        }
    </style>
</body>

</html>
